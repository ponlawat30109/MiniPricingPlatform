services:
  rule-service:
    build:
      context: ./apps/rule-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing-service:
    build:
      context: ./apps/pricing-service
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - RuleService__BaseUrl=http://rule-service:5000
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      rule-service:
        condition: service_healthy

  pricing-web:
    build:
      context: ./apps/pricing-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - rule-service
      - pricing-service
